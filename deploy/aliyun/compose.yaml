name: daguanyuan
services:
  garden:
    image: ${GARDEN_IMAGE:?Set GARDEN_IMAGE to the verified release tag}
    container_name: daguanyuan
    user: "1000:1000"
    init: true
    restart: unless-stopped
    env_file:
      - /srv/daguanyuan/secrets/runtime.env
    environment:
      NODE_ENV: production
      PORT: "3000"
      DREAM_STORAGE_DIR: /data/dreams
    volumes:
      - /srv/daguanyuan/data/dreams:/data/dreams
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 128
    networks:
      edge:
        aliases: [daguanyuan]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
networks:
  edge:
    external: true
    name: daguanyuan-edge
