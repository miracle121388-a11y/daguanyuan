<!doctype html><html lang="zh"><head><meta charset="UTF-8"><title>Blender → GLB → WebGL 验证</title><style>body{margin:0;background:#edeadd}canvas{display:block;width:100vw;height:100vh}#status{position:fixed;left:20px;top:20px;background:#f7f4ea;padding:16px;font:16px sans-serif}</style></head><body><div id="status">正在载入管线验证场景</div><script type="module">
import * as THREE from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const scene=new THREE.Scene();scene.background=new THREE.Color('#eae8dd');const camera=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,.1,1000);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(1);document.body.append(renderer.domElement);const controls=new OrbitControls(camera,renderer.domElement);camera.position.set(36,32,43);controls.target.set(0,2,0);controls.update();scene.add(new THREE.HemisphereLight('#fff8df','#829584',3));const sun=new THREE.DirectionalLight('#fff2d0',3);sun.position.set(-20,40,20);scene.add(sun);const sample=new URLSearchParams(location.search).has('sample');new GLTFLoader().load(sample?'./models/sample.glb':'./models/pipeline-probe.glb',g=>{scene.add(g.scene);if(!sample){camera.position.set(5,4,6);controls.target.set(0,0,0);controls.update()}document.getElementById('status').textContent=sample?'潇湘馆 · Blender 样板场景':'Blender → GLB → WebGL 管线通过';window.probeLoaded=true},undefined,e=>{document.getElementById('status').textContent='加载失败：'+e.message});renderer.setAnimationLoop(()=>renderer.render(scene,camera));
</script></body></html>
